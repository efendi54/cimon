# Time span to inspect. "today-4d"/"today_end" resolve to actual dates at
# build time (see cimon.workflows.query_spec), so this never needs manual edits.
all:
  - column: job_runner_labels
    op: list_contains
    value: "app-adas-src"
  - column: job_status
    op: eq
    value: "in_progress"
  - column: created_at
    op: between
    value: ["today", "today_end"]
