default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: conventional-commit
        name: Check Conventional Commit message
        entry: uv run --locked cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
        always_run: true
