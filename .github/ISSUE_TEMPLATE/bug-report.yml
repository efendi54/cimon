name: 🐛 Bug Report
description: Report a bug or unexpected behavior.
labels:
  - unconfirmed
type: Bug

body:
  - type: markdown
    attributes:
      value: Thank you for reporting

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Please explain what you're seeing and what you would expect to see.

        Please provide as much detail as possible to make understanding and solving your problem as quick as possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you running?
    validations:
      required: true
  - type: input
    id: job
    attributes:
      label: Job URL
      description: The URL of the job that experienced the bug.
    validations:
      required: true
